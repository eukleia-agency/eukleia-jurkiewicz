.hero-inner{position:relative;z-index:2;padding:0 20px 54px;max-width:940px;margin:0 auto;width:100%}
.hero h1{font-size:clamp(46px,10vw,86px);line-height:1;margin:10px 0 14px}
.hero .sub{font-family:var(--serif);font-size:clamp(18px,4vw,24px);font-style:italic;color:var(--gold-soft)}
.hero .dates{margin-top:18px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.langbar{position:absolute;top:18px;right:20px;z-index:5;display:flex;gap:6px;background:rgba(255,255,255,.12);
  backdrop-filter:blur(8px);border-radius:999px;padding:4px}
.langbar button{border:0;background:transparent;color:rgba(255,255,255,.72);font-family:var(--sans);font-size:12px;
  font-weight:600;letter-spacing:.1em;padding:7px 14px;border-radius:999px;cursor:pointer}
.langbar button.on{background:var(--gold);color:#fff}
.brandmark{position:absolute;top:20px;left:20px;z-index:5;font-family:var(--serif);font-size:20px;letter-spacing:.32em;color:#fff;opacity:.9}

/* SECTIONS */
section{padding:64px 0}
.sec-head{margin-bottom:26px}
.sec-head h2{font-size:clamp(30px,6vw,42px);line-height:1.1;margin-top:6px}
.sec-head p{color:var(--muted);font-size:15px;margin-top:10px;max-width:60ch}

/* DAYS */
.dayrail{display:flex;gap:10px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.dayrail::-webkit-scrollbar{display:none}
.daychip{flex:0 0 auto;border:1px solid var(--rule);background:var(--paper);border-radius:14px;padding:12px 18px;
  cursor:pointer;text-align:center;min-width:96px;transition:.2s}
.daychip b{display:block;font-family:var(--serif);font-size:26px;line-height:1}
.daychip span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.daychip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.daychip.on span{color:var(--gold-soft)}
.daypanel{background:var(--paper);border:1px solid var(--rule);border-radius:18px;padding:26px}
.daypanel h3{font-size:26px;margin-bottom:4px}
.daypanel .dlead{color:var(--muted);font-size:14px;margin-bottom:18px}
.slot{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--rule)}
.slot:first-of-type{border-top:0}
.slot .when{flex:0 0 78px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;padding-top:3px}
.slot .what b{font-family:var(--serif);font-size:19px;font-weight:500}
.slot .what p{font-size:14px;color:var(--muted);margin-top:2px}
.flag{display:inline-block;margin-top:14px;background:#FBF6E9;border:1px solid #EADFC4;color:#7A6533;
  font-size:13px;padding:10px 14px;border-radius:12px}

/* MAP */
#map{height:420px;border-radius:18px;overflow:hidden;border:1px solid var(--rule)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.filters button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:8px 14px;
  font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.filters button.on{color:#fff;border-color:transparent}
.maplibregl-popup-content{font-family:var(--sans);border-radius:14px;padding:14px 16px}
.maplibregl-popup-content b{font-family:var(--serif);font-size:18px;font-weight:500}
.pin{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.28);border:2px solid #fff}

/* ACCORDIONS */
.acc{border:1px solid var(--rule);border-radius:18px;overflow:hidden;margin-bottom:12px;background:var(--paper)}
.acc-h{display:flex;align-items:center;gap:12px;padding:18px 20px;cursor:pointer;user-select:none}
.acc-h .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.acc-h b{font-family:var(--serif);font-size:23px;font-weight:500;flex:1}
.acc-h .cnt{font-size:12px;color:var(--muted)}
.acc-h .chev{transition:.25s;color:var(--muted)}
.acc.open .chev{transform:rotate(180deg)}
.acc-b{display:none;padding:0 20px 12px}
.acc.open .acc-b{display:block}
.card{border-top:1px solid var(--rule);padding:16px 0;display:flex;gap:14px}
.card .emo{font-size:22px;flex:0 0 30px;line-height:1.2}
.card h4{font-family:var(--serif);font-size:20px;font-weight:500}
.card p{font-size:14.5px;color:#4B5464;margin:4px 0 8px}
.card .meta{font-size:12.5px;color:var(--muted)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.links a{font-size:12px;font-weight:600;text-decoration:none;border:1px solid var(--rule);
  border-radius:999px;padding:6px 12px;color:var(--navy);background:#fff}
.links a:hover{border-color:var(--gold);color:var(--gold)}

/* MAISON */
.night{background:var(--navy);color:#fff}
.night .sec-head h2{color:#fff}
.night .sec-head p{color:rgba(255,255,255,.7)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:20px}
.box h4{font-family:var(--serif);font-size:21px;font-weight:500;margin-bottom:8px;color:var(--gold-soft)}
.box p{font-size:14.5px;color:rgba(255,255,255,.86);margin-bottom:6px}
.box a{color:#fff}
.copy{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.08);
  border-radius:10px;padding:9px 12px;margin-top:8px;font-size:14px}
.copy button{border:0;background:var(--gold);color:#fff;font-family:var(--sans);font-weight:600;font-size:11px;
  letter-spacing:.08em;padding:6px 12px;border-radius:8px;cursor:pointer}
.pill-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill-links a{font-size:12.5px;font-weight:600;text-decoration:none;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 14px;color:#fff}

/* CTA */
.cta{text-align:center;padding:70px 0}
.cta h2{font-size:clamp(30px,6vw,44px)}
.cta p{color:var(--muted);max-width:52ch;margin:12px auto 24px}
.btn{display:inline-block;background:var(--gold);color:#fff;text-decoration:none;font-weight:700;font-size:14px;
  letter-spacing:.06em;padding:15px 30px;border-radius:999px}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--navy);margin-left:8px}
footer{border-top:1px solid var(--rule);padding:34px 0 46px;text-align:center;color:var(--muted);font-size:12.5px}
footer .lg{font-family:var(--serif);font-size:22px;letter-spacing:.34em;color:var(--navy);margin-bottom:8px}
@media(max-width:600px){
  .slot .when{flex:0 0 62px}
  .btn.ghost{margin:10px 0 0 0}
  #map{height:340px}
}
</style>

/* ============ Render ============ */
let lang = new URLSearchParams(location.search).get('lang')==='en' ? 'en' : 'pl';
let curDay = 0, active = new Set(CATS.map(c=>c.id)), map=null, markers=[];

function catColor(id){return CATS.find(c=>c.id===id).c;}

function applyStatic(){
  document.documentElement.lang = lang;
  document.documentElement.setAttribute('data-lang',lang);
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n'); if(T[lang][k]) el.textContent = T[lang][k];
  });
  document.querySelectorAll('[data-setlang]').forEach(b=>b.classList.toggle('on',b.dataset.setlang===lang));
  document.getElementById('waBtn').href =
    "https://wa.me/33651669485?text="+encodeURIComponent(T[lang].waMsg);
}

function renderFilters(){
  const f = document.getElementById('filters'); f.innerHTML='';
  CATS.forEach(c=>{
    const b=document.createElement('button');
    b.textContent=T[lang].cats[c.id];
    if(active.has(c.id)){b.classList.add('on');b.style.background=c.c;}
    b.onclick=()=>{active.has(c.id)?active.delete(c.id):active.add(c.id);renderFilters();renderMarkers();renderAccs();};
    f.appendChild(b);
  });
}

function gmaps(p){
  let u="https://www.google.com/maps/dir/?api=1&destination="+p.lat+","+p.lng;
  if(p.pid) u+="&destination_place_id="+p.pid;
  return u;
}

function renderAccs(){
  const w=document.getElementById('accs'); const open=[...w.querySelectorAll('.acc.open')].map(a=>a.dataset.cat);
  w.innerHTML='';
  CATS.filter(c=>active.has(c.id)).forEach((c,i)=>{
    const items=P.filter(p=>p.cat===c.id); if(!items.length) return;
    const d=document.createElement('div'); d.className='acc'; d.dataset.cat=c.id;
    if(open.includes(c.id)||(open.length===0&&i===0)) d.classList.add('open');
    d.innerHTML=`<div class="acc-h"><span class="dot" style="background:${c.c}"></span>
      <b>${T[lang].cats[c.id]}</b><span class="cnt">${items.length}</span><span class="chev">▾</span></div>
      <div class="acc-b">${items.map(p=>`
        <div class="card"><div class="emo">${p.emo}</div><div>
          <h4>${p.n}</h4><p>${p[lang]}</p>
          <div class="links"><a href="${gmaps(p)}" target="_blank" rel="noopener">${T[lang].route}</a>
          ${p.tel?`<a href="tel:${p.tel}">${T[lang].call}</a>`:''}</div>
        </div></div>`).join('')}</div>`;
    d.querySelector('.acc-h').onclick=()=>d.classList.toggle('open');
    w.appendChild(d);
  });
}

function renderDays(){
  const r=document.getElementById('dayrail'); r.innerHTML='';
  DAYS.forEach((d,i)=>{
    const b=document.createElement('div'); b.className='daychip'+(i===curDay?' on':'');
    b.innerHTML=`<span>${d[lang].dow}</span><b>${d.d}</b>`;
    b.onclick=()=>{curDay=i;renderDays();};
    r.appendChild(b);
  });
  const d=DAYS[curDay];
  document.getElementById('daypanel').innerHTML=
    `<h3>${d[lang].t}</h3><div class="dlead">${d[lang].l}</div>`+
    d.slots.map(s=>`<div class="slot"><div class="when">${lang==='pl'?s.plw:s.enw}</div>
      <div class="what"><b>${lang==='pl'?s.plt:s.ent}</b><p>${lang==='pl'?s.pld:s.end}</p></div></div>`).join('')+
    `<div class="flag">${lang==='pl'?d.plflag:d.enflag}</div>`;
}

function renderMarkers(){
  markers.forEach(m=>m.remove()); markers=[];
  if(!map) return;
  P.filter(p=>active.has(p.cat)).forEach(p=>{
    const el=document.createElement('div'); el.className='pin';
    el.style.borderColor=catColor(p.cat); el.textContent=p.emo;
    const pop=new maplibregl.Popup({offset:18}).setHTML(
      `<b>${p.n}</b><div style="font-size:13px;color:#5a6272;margin:6px 0 8px">${p[lang]}</div>
       <a href="${gmaps(p)}" target="_blank" style="font-size:12px;font-weight:700;color:${catColor(p.cat)}">${T[lang].route} →</a>`);
    markers.push(new maplibregl.Marker({element:el}).setLngLat([p.lng,p.lat]).setPopup(pop).addTo(map));
  });
}

function initMap(){
  try{
    map=new maplibregl.Map({
      container:'map', style:'https://tiles.openfreemap.org/styles/liberty',
      center:[0.0790,49.3585], zoom:12.4, pitch:52, bearing:-14, attributionControl:true
    });
    map.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');
    map.on('load',()=>{
      const l=map.getStyle().layers||[];
      l.forEach(ly=>{
        try{
          if(ly.type==='background') map.setPaintProperty(ly.id,'background-color','#F1EDE3');
          if(/water/i.test(ly.id)&&ly.type==='fill') map.setPaintProperty(ly.id,'fill-color','#C9D6DE');
          if(/landuse|park|wood|grass/i.test(ly.id)&&ly.type==='fill') map.setPaintProperty(ly.id,'fill-color','#E3E6D8');
          if(/building/i.test(ly.id)&&ly.type==='fill-extrusion'){
            map.setPaintProperty(ly.id,'fill-extrusion-color','#DCD5C6');
            map.setPaintProperty(ly.id,'fill-extrusion-opacity',.85);
          }
          if(/road|highway/i.test(ly.id)&&ly.type==='line') map.setPaintProperty(ly.id,'line-color','#FFFDF9');
        }catch(e){}
      });
      const home=document.createElement('div'); home.className='pin';
      home.style.borderColor='#1B2B4B'; home.style.background='#1B2B4B'; home.textContent='⚓';
      new maplibregl.Marker({element:home}).setLngLat([0.0770,49.3648])
        .setPopup(new maplibregl.Popup({offset:18}).setHTML('<b>Le Landemer</b><div style="font-size:13px;color:#5a6272">14 rue Landemer · Port-Deauville</div>')).addTo(map);
      renderMarkers();
    });
  }catch(e){document.getElementById('map').style.display='none';}
}

document.querySelectorAll('[data-setlang]').forEach(b=>{
  b.onclick=()=>{lang=b.dataset.setlang;applyStatic();renderFilters();renderDays();renderAccs();renderMarkers();
    history.replaceState(null,'','?lang='+lang);};
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]'); if(!b) return;
  navigator.clipboard.writeText(b.dataset.copy).then(()=>{
    const o=b.textContent; b.textContent='✓'; setTimeout(()=>b.textContent=o,1400);});
});
document.getElementById('shareBtn').onclick=e=>{
  e.preventDefault();
  if(navigator.share) navigator.share({title:'Le Landemer · Eukleia',url:location.href});
  else navigator.clipboard.writeText(location.href);
};
/* auto-select today's day if within the stay */
(function(){
  const t=new Date(), m=t.getMonth(), d=t.getDate();
  const idx=DAYS.findIndex(x=>parseInt(x.d,10)===d && ((m===6&&parseInt(x.d,10)>=30)||(m===7&&parseInt(x.d,10)<=3)));
  if(idx>-1) curDay=idx;
})();
applyStatic(); renderFilters(); renderDays(); renderAccs(); initMap();
</script>
